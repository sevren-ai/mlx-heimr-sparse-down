[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-heimr-sparse-down"
version = "0.1.0"
description = "Sparse MoE down projection and MTP speculative decoding for NVIDIA Nemotron 3.5 Lightning 30B A3B on MLX, from the stock 4-bit checkpoint"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sevren" }]
dependencies = [
    "huggingface_hub",
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
heimr-sparse-down = "hsd.cli:main"

[tool.setuptools]
packages = ["hsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
